<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f9f8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Wortschatz" />
<meta name="description" content="A list-first German vocabulary reader with active/passive study, sticky columns, next/back, notes, local progress and offline reading." />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/icon.svg" />
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
<title>Wortschatz Daily — German Vocabulary</title>
<link rel="stylesheet" href="./styles.css?v=4" />
</head>
<body>
<div id="appShell" class="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-wrap"><div class="logo">W<span>.</span></div><div><div class="brand">Wortschatz <span>Daily</span></div><div class="subbrand">German A1 → A2 · Your daily reader</div></div></div>
      <button class="icon-button" id="themeButton" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><span aria-hidden="true">◐</span></button>
    </div>
  </header>
  <main class="content" id="app" aria-live="off"><div class="loading">Loading vocabulary…</div></main>
  <nav class="bottom-nav" aria-label="Main navigation" id="bottomNav"></nav>
  <div id="detailRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="./app.js?v=4" defer></script>
</body>
</html>
